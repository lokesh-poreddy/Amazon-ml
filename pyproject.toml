[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-challenge"
version = "0.1.0"
description = "Adaptive competition framework for Amazon ML Challenge 2026"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
gbm = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
data = ["pyarrow>=13.0", "fastparquet>=2023.0"]
viz  = ["matplotlib>=3.7", "seaborn>=0.12"]
nlp  = ["sentence-transformers>=2.2", "transformers>=4.35"]
vision = ["Pillow>=10.0", "open-clip-torch>=2.23"]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "jupyterlab>=4.0", "ipywidgets>=8.0"]
all  = [
    "amazon-ml-challenge[gbm,data,viz,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
