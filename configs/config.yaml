# ============================================================
# Amazon ML Challenge 2026 — Master Configuration
# ============================================================
# Fill this file AFTER reading the official problem statement.
# DO NOT guess at task type or metric before reading it.
#
# IMPORTANT: task.direction has NO silent default.
# Leaving it null will raise a ConfigError at training time.
# ============================================================

project:
  seed: 42
  debug: false          # set true for fast dev iteration (small data)
  final_run: false      # set true ONLY for the final submission run

# ─────────────────────────────────────────────────────────────
# DATA — paths only. No task semantics here.
# ─────────────────────────────────────────────────────────────
data:
  train_path:     "data/raw/train.csv"
  test_path:      "data/raw/test.csv"
  image_dir:      null          # e.g. "data/raw/images"
  cache_dir:      "embedding_cache"
  artifacts_dir:  "artifacts"
  submission_dir: "submission"
  logs_dir:       "logs"

# ─────────────────────────────────────────────────────────────
# TASK — single source of truth for the task contract
# Fill ALL fields from the official problem statement.
# ─────────────────────────────────────────────────────────────
task:
  type:              null   # regression | binary | multiclass
  target_column:     null   # e.g. "entity_value"
  id_column:         null   # e.g. "index" or "sample_id"
  prediction_column: "prediction"
  metric:            null   # smape | mae | rmse | auc | f1 | accuracy | ...
  direction:         null   # minimize | maximize  ← MUST SET. NO DEFAULT.
  output_format:     "csv"
  is_multilabel:     false

# ─────────────────────────────────────────────────────────────
# SPLIT
# ─────────────────────────────────────────────────────────────
split:
  strategy:      "kfold"   # kfold | stratified | group | timeseries | holdout
  n_splits:      5
  shuffle:       true
  seed:          42
  group_col:     null      # required for GroupKFold
  time_col:      null      # required for timeseries
  holdout_frac:  0.2

# ─────────────────────────────────────────────────────────────
# MODEL
# ─────────────────────────────────────────────────────────────
model:
  primary:    "lgbm"
  candidates: ["lgbm"]
  early_stopping_rounds: 100

  lgbm_params:
    n_estimators:       1000
    learning_rate:      0.05
    num_leaves:         127
    min_child_samples:  20
    subsample:          0.8
    colsample_bytree:   0.8
    reg_alpha:          0.1
    reg_lambda:         1.0
    verbose:            -1
    n_jobs:             -1

  xgb_params:
    n_estimators:       1000
    learning_rate:      0.05
    max_depth:          6
    subsample:          0.8
    colsample_bytree:   0.8
    reg_alpha:          0.1
    reg_lambda:         1.0
    verbosity:          0

  catboost_params:
    iterations:     1000
    learning_rate:  0.05
    depth:          6
    l2_leaf_reg:    3.0
    verbose:        0

# ─────────────────────────────────────────────────────────────
# FEATURES
# ─────────────────────────────────────────────────────────────
features:
  numeric_cols:       []    # fill after schema audit
  categorical_cols:   []    # fill after schema audit
  text_cols:          []    # fill after schema audit

  image_url_column:   null  # e.g. "image_link"
  image_path_column:  null

  use_tfidf:           true
  tfidf_max_features:  50000
  tfidf_ngram_range:   [1, 2]

  use_text_structured: true

  use_image_embeddings: false
  image_encoder:        "openai/clip-vit-base-patch32"

  use_text_embeddings: false
  text_encoder:        "sentence-transformers/all-MiniLM-L6-v2"
